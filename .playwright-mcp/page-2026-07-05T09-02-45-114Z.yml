      - paragraph [ref=e70]:
        - text: Cosmin Cristea and Andrei Marginean recently attended Techsylvania 2026, one of the leading technology and innovation events in the region.
        - text: The event brought together founders, technology leaders, innovators, and industry experts to explore the trends shaping the future of business and technology. It was a valuable opportunity to exchange ideas, gain new insights into AI and digital transformation, and strengthen connections within the tech community.
        - text: We're excited to bring these learnings back to ddroidd and continue driving innovation for our clients and partners.
